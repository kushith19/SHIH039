id: public-transport-management
name: Public Transport Management System

category: transportation
type: public_transport_management

description: >
  Central public transport management platform responsible for monitoring
  city transit vehicles, managing routes and schedules, processing vehicle
  location data, coordinating fleet operations, and providing transport
  information to connected passenger and operational services.

criticality: high

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: morning_rush
      start: "06:30"
      end: "10:00"
      priority: 10

    - id: daytime
      start: "10:00"
      end: "17:00"
      priority: 5

    - id: evening_rush
      start: "17:00"
      end: "21:30"
      priority: 10

    - id: night
      start: "21:30"
      end: "06:30"
      priority: 5

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: moderate
    networkActivity: high
    expectedOperations: fleet_management
    expectedUsers: moderate
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: high
    networkActivity: very_high
    expectedOperations: fleet_management
    expectedUsers: high
    healthStatus: healthy

  night:
    activityLevel: low
    communicationPattern: continuous
    workload: light
    administrativeActivity: moderate
    networkActivity: moderate
    expectedOperations: fleet_monitoring
    expectedUsers: low
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: high
    administrativeActivity: moderate
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: active_vehicles
      unit: vehicles
      min: 0
      max: 5000

    - name: vehicle_location_updates
      unit: updates/s
      min: 0
      max: 10000

    - name: active_routes
      unit: routes
      min: 0
      max: 1000

    - name: passenger_information_requests
      unit: requests/s
      min: 0
      max: 5000

    - name: schedule_updates
      unit: updates/min
      min: 0
      max: 1000

    - name: vehicle_communication_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: vehicle_connection_failures
      unit: failures/min
      min: 0
      max: 1000

    - name: delayed_vehicles
      unit: vehicles
      min: 0
      max: 5000

    - name: api_requests
      unit: requests/s
      min: 0
      max: 5000

    - name: error_rate
      unit: percent
      min: 0
      max: 100

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 500000000

actors:

  - transit-operators
  - transit-administrators
  - drivers
  - passengers
  - city-transportation-administrators

dependencies:

  - endpoint: telecom-network-gateway
    type: required
    weight: 1.0

metadata:

  environment: production

  protocols:
    - HTTPS
    - TLS
    - MQTT

  capabilities:
    - fleet_tracking
    - route_management
    - schedule_management
    - passenger_information
    - vehicle_monitoring

  location:
    facility: transit_operations_center
    zone: transportation_network
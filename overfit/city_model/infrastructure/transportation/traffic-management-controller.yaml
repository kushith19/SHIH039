id: traffic-management-controller
name: Traffic Management Controller

category: transportation
type: traffic_management_controller

description: >
  Central traffic management system responsible for monitoring traffic
  conditions, coordinating traffic signal operations, processing data
  from roadside sensors and traffic cameras, and supporting real-time
  traffic-flow management across managed road intersections.

criticality: critical

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: morning_rush
      start: "07:00"
      end: "10:00"
      priority: 10

    - id: daytime
      start: "10:00"
      end: "17:00"
      priority: 5

    - id: evening_rush
      start: "17:00"
      end: "21:00"
      priority: 10

    - id: night
      start: "21:00"
      end: "07:00"
      priority: 5

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: low
    networkActivity: high
    expectedOperations: traffic_monitoring
    expectedUsers: moderate
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: moderate
    networkActivity: very_high
    expectedOperations: traffic_management
    expectedUsers: high
    healthStatus: healthy

  night:
    activityLevel: low
    communicationPattern: continuous
    workload: light
    administrativeActivity: low
    networkActivity: moderate
    expectedOperations: traffic_monitoring
    expectedUsers: low
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: high
    administrativeActivity: low
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: moderate
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: active_signal_controllers
      unit: controllers
      min: 0
      max: 1000

    - name: signal_changes
      unit: changes/min
      min: 0
      max: 5000

    - name: vehicle_count
      unit: vehicles/min
      min: 0
      max: 10000

    - name: sensor_messages
      unit: messages/s
      min: 0
      max: 20000

    - name: controller_response_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: traffic_incidents
      unit: incidents/min
      min: 0
      max: 100

    - name: communication_errors
      unit: errors/s
      min: 0
      max: 1000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 500000000

    - name: active_connections
      unit: connections
      min: 0
      max: 10000

actors:

  - traffic-operators
  - traffic-control-administrators
  - emergency-responders
  - city-transportation-administrators

dependencies:

  - endpoint: traffic-sensor-gateway
    type: required
    weight: 1.0

  - endpoint: traffic-camera
    type: supporting
    weight: 0.8

  - endpoint: telecom-network-gateway
    type: required
    weight: 1.0

metadata:

  environment: production

  protocols:
    - HTTPS
    - TLS
    - MQTT

  functions:
    - traffic_monitoring
    - signal_coordination
    - congestion_management
    - incident_detection

  location:
    facility: traffic_management_center
    zone: transportation_network
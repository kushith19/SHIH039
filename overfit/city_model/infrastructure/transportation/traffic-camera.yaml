id: traffic-camera
name: Traffic Camera

category: transportation
type: traffic_camera

description: >
  Network-connected roadside camera used for real-time traffic
  observation, vehicle detection, congestion monitoring, and incident
  detection. The camera continuously sends video and analytical data
  to the city's traffic management infrastructure.

criticality: high

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: daytime
      start: "06:00"
      end: "21:00"
      priority: 8

    - id: night
      start: "21:00"
      end: "06:00"
      priority: 5

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: low
    networkActivity: high
    expectedOperations: traffic_monitoring
    expectedUsers: low
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: low
    networkActivity: very_high
    expectedOperations: traffic_monitoring
    expectedUsers: moderate
    healthStatus: healthy

  night:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: low
    networkActivity: high
    expectedOperations: traffic_monitoring
    expectedUsers: low
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: high
    administrativeActivity: low
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: low
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: low
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: active_video_streams
      unit: streams
      min: 0
      max: 10

    - name: frames_per_second
      unit: frames/s
      min: 0
      max: 60

    - name: detected_vehicles
      unit: vehicles/min
      min: 0
      max: 5000

    - name: detected_pedestrians
      unit: pedestrians/min
      min: 0
      max: 5000

    - name: video_processing_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: dropped_frames
      unit: frames/s
      min: 0
      max: 60

    - name: camera_connection_errors
      unit: errors/min
      min: 0
      max: 500

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 200000000

    - name: storage_usage
      unit: percent
      min: 0
      max: 100

actors:

  - traffic-operators
  - traffic-control-administrators
  - emergency-responders
  - city-transportation-administrators

dependencies:


  - endpoint: telecom-network-gateway
    type: required
    weight: 1.0

metadata:

  environment: production

  protocols:
    - HTTPS
    - RTSP
    - TLS

  capabilities:
    - video_streaming
    - vehicle_detection
    - pedestrian_detection
    - incident_detection

  location:
    facility: roadside
    zone: transportation_network
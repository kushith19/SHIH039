id: smart-meter-gateway
name: Smart Electricity Meter Gateway

category: energy
type: smart_meter_gateway

description: >
  Edge gateway responsible for collecting and aggregating electricity
  consumption data from connected residential, commercial, and industrial
  smart meters. It validates meter readings, monitors meter connectivity,
  and forwards aggregated consumption information to the city's energy
  management infrastructure.

criticality: high

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: morning_demand
      start: "06:00"
      end: "10:00"
      priority: 10

    - id: daytime
      start: "10:00"
      end: "18:00"
      priority: 6

    - id: evening_demand
      start: "18:00"
      end: "22:00"
      priority: 10

    - id: night
      start: "22:00"
      end: "06:00"
      priority: 5

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: periodic
    workload: moderate
    administrativeActivity: low
    networkActivity: moderate
    expectedOperations: meter_data_collection
    expectedUsers: low
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: moderate
    networkActivity: high
    expectedOperations: meter_data_collection
    expectedUsers: moderate
    healthStatus: healthy

  night:
    activityLevel: low
    communicationPattern: periodic
    workload: light
    administrativeActivity: low
    networkActivity: low
    expectedOperations: meter_data_collection
    expectedUsers: low
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: moderate
    administrativeActivity: low
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: high
    administrativeActivity: moderate
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: low
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: moderate
    administrativeActivity: high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: connected_meters
      unit: meters
      min: 0
      max: 100000

    - name: meter_readings
      unit: readings/min
      min: 0
      max: 100000

    - name: electricity_consumption
      unit: kWh
      min: 0
      max: 100000

    - name: peak_demand
      unit: MW
      min: 0
      max: 5000

    - name: meter_communication_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: failed_meter_readings
      unit: readings/min
      min: 0
      max: 10000

    - name: disconnected_meters
      unit: meters
      min: 0
      max: 100000

    - name: anomalous_consumption_events
      unit: events/min
      min: 0
      max: 1000

    - name: gateway_connection_errors
      unit: errors/min
      min: 0
      max: 1000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 300000000

actors:

  - residential_consumers
  - commercial_consumers
  - industrial_consumers
  - power-operators
  - energy-administrators
  - maintenance-technicians

dependencies:

  - endpoint: distribution-management-system
    type: supporting
    weight: 0.8

metadata:

  environment: production

  protocols:
    - MQTT
    - HTTPS
    - TLS

  meterTypes:
    - residential
    - commercial
    - industrial

  capabilities:
    - meter_data_collection
    - consumption_monitoring
    - demand_monitoring
    - anomaly_detection

  location:
    facility: distributed_energy_network
    zone: energy_distribution_network
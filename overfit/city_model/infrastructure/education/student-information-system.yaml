id: student-information-system
name: Student Information System

category: education
type: student_information_system

description: >
  Central student information platform responsible for maintaining
  student profiles, enrollment records, course registrations, attendance,
  grades, academic history, and other core student information used by
  educational institutions.

criticality: critical

operating_schedule:
  defaultPhase: daytime

  phases:
    - id: morning
      start: "08:00"
      end: "13:00"
      priority: 8

    - id: afternoon
      start: "13:00"
      end: "17:00"
      priority: 8

    - id: evening
      start: "17:00"
      end: "21:00"
      priority: 5

    - id: night
      start: "21:00"
      end: "08:00"
      priority: 3

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: high
    networkActivity: moderate
    expectedOperations: student_record_management
    expectedUsers: moderate
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: very_high
    networkActivity: high
    expectedOperations: enrollment_and_records
    expectedUsers: very_high
    healthStatus: healthy

  night:
    activityLevel: low
    communicationPattern: periodic
    workload: light
    administrativeActivity: low
    networkActivity: low
    expectedOperations: record_access
    expectedUsers: low
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: moderate
    administrativeActivity: high
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: high
    administrativeActivity: very_high
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: low
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: moderate
    administrativeActivity: very_high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: high
    administrativeActivity: very_high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: active_users
      unit: users
      min: 0
      max: 10000

    - name: student_record_requests
      unit: requests/min
      min: 0
      max: 10000

    - name: enrollment_transactions
      unit: transactions/min
      min: 0
      max: 5000

    - name: attendance_updates
      unit: updates/min
      min: 0
      max: 5000

    - name: grade_updates
      unit: updates/min
      min: 0
      max: 3000

    - name: course_registration_requests
      unit: requests/min
      min: 0
      max: 5000

    - name: database_queries
      unit: queries/s
      min: 0
      max: 5000

    - name: response_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: failed_requests
      unit: requests/min
      min: 0
      max: 1000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 300000000

actors:

  - students
  - teachers
  - administrative-staff
  - education-administrators

dependencies:

  - endpoint: campus-network-gateway
    type: required
    weight: 1.0

metadata:

  environment: production

  protocols:
    - HTTPS
    - TLS
    - REST

  functions:
    - student_records
    - enrollment
    - attendance
    - grade_management
    - course_registration

  dataClassification:
    - student_records
    - academic_records
    - enrollment_records

  location:
    facility: educational_institution
    zone: education_network
id: network-management-system
name: Telecommunications Network Management System

category: telecommunications
type: network_management_system

description: >
  Central network management platform responsible for monitoring,
  configuring, and managing telecommunications network infrastructure.
  It collects network health and performance information, tracks faults,
  manages network configuration, and provides operational visibility to
  network administrators and engineers.

criticality: critical

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: daytime
      start: "06:00"
      end: "22:00"
      priority: 8

    - id: night
      start: "22:00"
      end: "06:00"
      priority: 5

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: high
    networkActivity: high
    expectedOperations: network_monitoring
    expectedUsers: moderate
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: very_high
    networkActivity: very_high
    expectedOperations: network_monitoring
    expectedUsers: high
    healthStatus: healthy

  night:
    activityLevel: low
    communicationPattern: continuous
    workload: light
    administrativeActivity: moderate
    networkActivity: moderate
    expectedOperations: network_monitoring
    expectedUsers: low
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: very_high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: managed_devices
      unit: devices
      min: 0
      max: 100000

    - name: network_events
      unit: events/min
      min: 0
      max: 50000

    - name: active_alarms
      unit: alarms
      min: 0
      max: 10000

    - name: critical_alarms
      unit: alarms
      min: 0
      max: 5000

    - name: configuration_changes
      unit: changes/min
      min: 0
      max: 5000

    - name: device_health_checks
      unit: checks/min
      min: 0
      max: 50000

    - name: management_requests
      unit: requests/min
      min: 0
      max: 10000

    - name: network_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: device_connection_failures
      unit: failures/min
      min: 0
      max: 10000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 500000000

actors:

  - network-operators
  - network-engineers
  - telecom-administrators
  - security-administrators

dependencies: []

  
metadata:

  environment: production

  protocols:
    - SNMP
    - HTTPS
    - TLS
    - NETCONF

  capabilities:
    - network_monitoring
    - fault_management
    - configuration_management
    - performance_monitoring
    - device_management

  location:
    facility: telecommunications_network
    zone: network_operations_center
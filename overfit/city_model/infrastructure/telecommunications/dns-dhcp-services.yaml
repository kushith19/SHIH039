id: dns-dhcp-services
name: DNS and DHCP Services

category: telecommunications
type: dns_dhcp_services

description: >
  Core network services responsible for resolving network names to
  addresses and providing dynamic network address configuration to
  connected devices across city telecommunications infrastructure.

criticality: high

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: daytime
      start: "06:00"
      end: "22:00"
      priority: 8

    - id: night
      start: "22:00"
      end: "06:00"
      priority: 5

behaviour:

  normal:
    activityLevel: high
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: low
    networkActivity: high
    expectedOperations: network_name_and_address_services
    expectedUsers: very_high
    healthStatus: healthy

  peak:
    activityLevel: very_high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: moderate
    networkActivity: very_high
    expectedOperations: network_name_and_address_services
    expectedUsers: very_high
    healthStatus: healthy

  night:
    activityLevel: moderate
    communicationPattern: continuous
    workload: light
    administrativeActivity: low
    networkActivity: moderate
    expectedOperations: network_name_and_address_services
    expectedUsers: high
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: high
    administrativeActivity: low
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: moderate
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: dns_queries
      unit: queries/s
      min: 0
      max: 100000

    - name: dns_response_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: dns_failed_queries
      unit: queries/s
      min: 0
      max: 10000

    - name: dhcp_requests
      unit: requests/s
      min: 0
      max: 50000

    - name: active_leases
      unit: leases
      min: 0
      max: 10000000

    - name: lease_failures
      unit: failures/s
      min: 0
      max: 10000

    - name: cache_hit_rate
      unit: percent
      min: 0
      max: 100

    - name: network_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 500000000

actors:

  - citizens
  - network-operators
  - telecom-administrators
  - city-infrastructure-systems
  - iot-devices

dependencies: []

metadata:

  environment: production

  protocols:
    - DNS
    - DHCP
    - UDP
    - TCP
    - TLS

  capabilities:
    - name_resolution
    - address_assignment
    - network_configuration
    - service_discovery

  security:
    access_control: true
    encrypted_management: true

  location:
    facility: telecommunications_network
    zone: core_network
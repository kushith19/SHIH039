id: telecom-network-gateway
name: Telecommunications Network Gateway

category: telecommunications
type: network_gateway

description: >
  Core network gateway responsible for providing secure network
  connectivity between city digital infrastructure, service networks,
  external networks, and telecommunications infrastructure. It handles
  high-volume network traffic and provides controlled communication
  paths between connected systems.

criticality: critical

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: daytime
      start: "06:00"
      end: "22:00"
      priority: 8

    - id: night
      start: "22:00"
      end: "06:00"
      priority: 5

behaviour:

  normal:
    activityLevel: high
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: moderate
    networkActivity: very_high
    expectedOperations: network_routing
    expectedUsers: very_high
    healthStatus: healthy

  peak:
    activityLevel: very_high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: high
    networkActivity: very_high
    expectedOperations: network_routing
    expectedUsers: very_high
    healthStatus: healthy

  night:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: low
    networkActivity: high
    expectedOperations: network_routing
    expectedUsers: high
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: very_high
    administrativeActivity: moderate
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: active_connections
      unit: connections
      min: 0
      max: 100000

    - name: incoming_bandwidth
      unit: bytes/s
      min: 0
      max: 10000000000

    - name: outgoing_bandwidth
      unit: bytes/s
      min: 0
      max: 10000000000

    - name: packets_per_second
      unit: packets/s
      min: 0
      max: 10000000

    - name: network_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: packet_loss
      unit: percent
      min: 0
      max: 100

    - name: connection_failures
      unit: failures/min
      min: 0
      max: 10000

    - name: blocked_connections
      unit: connections/min
      min: 0
      max: 50000

    - name: routing_errors
      unit: errors/min
      min: 0
      max: 10000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: active_routes
      unit: routes
      min: 0
      max: 100000

actors:

  - network-operators
  - telecom-administrators
  - network-engineers
  - city-infrastructure-administrators

dependencies: []

 

metadata:

  environment: production

  protocols:
    - TCP
    - UDP
    - HTTPS
    - TLS
    - BGP

  capabilities:
    - network_routing
    - traffic_forwarding
    - connection_management
    - access_control

  security:
    traffic_filtering: true
    access_control: true
    encrypted_communication: true

  location:
    facility: telecommunications_network
    zone: core_network
id: water-quality-monitoring
name: Water Quality Monitoring System

category: water
type: water_quality_monitoring

description: >
  Digital monitoring system responsible for collecting and analyzing
  water-quality measurements from treatment and distribution facilities,
  detecting abnormal conditions, and providing quality information to
  water treatment and distribution operators.

criticality: high

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: daytime
      start: "06:00"
      end: "22:00"
      priority: 8

    - id: night
      start: "22:00"
      end: "06:00"
      priority: 5

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: low
    networkActivity: high
    expectedOperations: water_quality_monitoring
    expectedUsers: low
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: moderate
    networkActivity: very_high
    expectedOperations: water_quality_monitoring
    expectedUsers: moderate
    healthStatus: healthy

  night:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: low
    networkActivity: high
    expectedOperations: water_quality_monitoring
    expectedUsers: low
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: high
    administrativeActivity: low
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: moderate
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: low
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: ph_level
      unit: pH
      min: 0
      max: 14

    - name: turbidity
      unit: NTU
      min: 0
      max: 1000

    - name: chlorine_level
      unit: mg/L
      min: 0
      max: 20

    - name: conductivity
      unit: uS/cm
      min: 0
      max: 5000

    - name: water_temperature
      unit: celsius
      min: 0
      max: 50

    - name: quality_samples
      unit: samples/min
      min: 0
      max: 1000

    - name: abnormal_quality_events
      unit: events/min
      min: 0
      max: 200

    - name: sensor_communication_errors
      unit: errors/min
      min: 0
      max: 500

    - name: sensor_message_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 200000000

actors:

  - water-plant-operators
  - water-quality-engineers
  - water-administrators
  - maintenance-technicians

dependencies:

  - endpoint: water-treatment-control
    type: supporting
    weight: 0.8

metadata:

  environment: production

  protocols:
    - MQTT
    - HTTPS
    - TLS

  monitoredParameters:
    - ph
    - turbidity
    - chlorine
    - conductivity
    - temperature

  capabilities:
    - quality_monitoring
    - anomaly_detection
    - quality_alerting

  location:
    facility: water_treatment_plant
    zone: water_infrastructure
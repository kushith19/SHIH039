id: municipal-management-system
name: Municipal Management System

category: government
type: municipal_management_system

description: >
  Central municipal operations platform responsible for managing
  departmental workflows, municipal service requests, work orders,
  municipal assets, administrative processes, and operational reporting.

criticality: high

operating_schedule:
  defaultPhase: daytime

  phases:
    - id: morning
      start: "08:00"
      end: "13:00"
      priority: 8

    - id: afternoon
      start: "13:00"
      end: "17:00"
      priority: 8

    - id: evening
      start: "17:00"
      end: "21:00"
      priority: 4

    - id: night
      start: "21:00"
      end: "08:00"
      priority: 2

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: high
    networkActivity: moderate
    expectedOperations: municipal_operations
    expectedUsers: moderate
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: very_high
    networkActivity: high
    expectedOperations: municipal_operations
    expectedUsers: high
    healthStatus: healthy

  night:
    activityLevel: low
    communicationPattern: periodic
    workload: light
    administrativeActivity: low
    networkActivity: low
    expectedOperations: operational_monitoring
    expectedUsers: low
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: moderate
    administrativeActivity: high
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: high
    administrativeActivity: very_high
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: low
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: moderate
    administrativeActivity: very_high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: high
    administrativeActivity: very_high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: active_users
      unit: users
      min: 0
      max: 10000

    - name: service_requests
      unit: requests/min
      min: 0
      max: 10000

    - name: work_orders
      unit: orders/min
      min: 0
      max: 5000

    - name: asset_updates
      unit: updates/min
      min: 0
      max: 5000

    - name: administrative_transactions
      unit: transactions/min
      min: 0
      max: 5000

    - name: report_generation_requests
      unit: requests/min
      min: 0
      max: 1000

    - name: response_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: failed_requests
      unit: requests/min
      min: 0
      max: 2000

    - name: active_administrator_sessions
      unit: sessions
      min: 0
      max: 1000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 300000000

actors:

  - government-employees
  - municipal-administrators
  - department-operators
  - service-operators

dependencies: []

metadata:

  environment: production

  protocols:
    - HTTPS
    - TLS
    - REST

  capabilities:
    - municipal_service_management
    - workflow_management
    - asset_management
    - work_order_management
    - operational_reporting

  security:
    authentication: true
    encrypted_communication: true
    access_control: true
    audit_logging: true

  location:
    facility: municipal_operations_center
    zone: government_network
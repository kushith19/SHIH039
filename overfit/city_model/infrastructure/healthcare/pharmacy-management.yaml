id: hospital-pharmacy
name: Hospital Pharmacy Management System

category: healthcare
type: pharmacy_management_system

description: >
  Hospital pharmacy application used to manage medication inventory,
  prescriptions, dispensing operations, medication orders, and
  pharmacy-related clinical workflows.

criticality: high

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: morning_shift
      start: "06:00"
      end: "10:00"
      priority: 8

    - id: daytime
      start: "10:00"
      end: "18:00"
      priority: 10

    - id: evening_shift
      start: "18:00"
      end: "23:00"
      priority: 8

    - id: night
      start: "23:00"
      end: "06:00"
      priority: 5

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: moderate
    networkActivity: moderate
    expectedOperations: prescription_processing
    expectedUsers: moderate
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: high
    networkActivity: high
    expectedOperations: prescription_processing
    expectedUsers: high
    healthStatus: healthy

  night:
    activityLevel: low
    communicationPattern: continuous
    workload: light
    administrativeActivity: low
    networkActivity: low
    expectedOperations: prescription_processing
    expectedUsers: low
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: moderate
    administrativeActivity: moderate
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: high
    administrativeActivity: high
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: low
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: moderate
    administrativeActivity: high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: prescriptions_processed
      unit: prescriptions/min
      min: 0
      max: 500

    - name: medication_orders
      unit: orders/min
      min: 0
      max: 300

    - name: medication_dispensing_events
      unit: events/min
      min: 0
      max: 500

    - name: active_pharmacy_users
      unit: users
      min: 0
      max: 200

    - name: inventory_transactions
      unit: transactions/min
      min: 0
      max: 500

    - name: inventory_alerts
      unit: alerts/min
      min: 0
      max: 100

    - name: application_response_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: failed_requests
      unit: requests/s
      min: 0
      max: 200

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 100000000

actors:

  - pharmacists
  - doctors
  - nurses
  - hospital-administrators
  - pharmacy-administrators
  - clinical-applications

dependencies:

  - endpoint: hospital-auth
    type: required
    weight: 1.0

  - endpoint: hospital-api-gateway
    type: required
    weight: 1.0

  - endpoint: hospital-database
    type: required
    weight: 0.9

  - endpoint: telecom-network-gateway
    type: required
    weight: 0.8

metadata:

  environment: production

  protocols:
    - HTTPS
    - TLS
    - REST

  dataClassification:
    - medication_data
    - prescription_data
    - patient_related_data

  functions:
    - prescription_management
    - medication_inventory
    - dispensing
    - medication_ordering

  location:
    facility: hospital
    zone: clinical_network
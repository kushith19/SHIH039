id: rush_hour
priority: 10
description: >
  Morning (07:00-10:00) and evening (17:00-20:00) commute surge.
  Transportation and telecom carry most of the load; finance sees a
  secondary bump from commuters using ATMs and payments on the move.

modifiers:

  transportation:
    activityLevel: peak
    communicationPattern: continuous
    workload: heavy
    networkActivity: high
    expectedOperations: high

  telecommunications:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    networkActivity: high

  energy:
    activityLevel: high
    workload: heavy
    networkActivity: high

  finance:
    activityLevel: very-high
    workload: very-high
    networkActivity: very-high
    expectedUsers: very-high

  public-safety:
    activityLevel: high
    workload: moderate
    networkActivity: high

  emergency-services:
    activityLevel: high
    expectedOperations: moderate
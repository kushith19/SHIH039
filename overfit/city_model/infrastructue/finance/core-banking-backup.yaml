id: core-banking-backup
name: Core Banking Backup

category: finance
type: core_banking_backup

description: >
  Standby core-banking replica used if the primary core-banking-system
  is unavailable.

criticality: critical

operating_schedule:
  defaultPhase: 24x7
  phases:
    - id: daytime
      start: "06:00"
      end: "22:00"
      priority: 7
    - id: night
      start: "22:00"
      end: "06:00"
      priority: 5

behaviour:
  normal:
    activityLevel: low
    communicationPattern: periodic
    workload: light
    networkActivity: low
    healthStatus: healthy
  peak:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    networkActivity: moderate
    healthStatus: healthy
  night:
    activityLevel: low
    communicationPattern: periodic
    workload: light
    networkActivity: low
    healthStatus: healthy

states:
  healthy:
    workload: light
    networkActivity: low
    healthStatus: healthy
  degraded:
    workload: moderate
    networkActivity: high
    healthStatus: degraded

telemetry:
  metrics:
    - name: packets_forwarded
      unit: packets/s
      min: 0
      max: 20000
    - name: cpu_usage
      unit: percent
      min: 0
      max: 100
    - name: failed_authentication_attempts
      unit: attempts/min
      min: 0
      max: 500

actors: []
dependencies:
  - endpoint: core-banking-system
    type: backup
    weight: 0.9

metadata:
  role: backup

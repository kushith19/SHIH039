id: citizen-services-portal
name: Citizen Services Portal

category: government
type: citizen_services_portal

description: >
  Public-facing digital platform through which citizens access government
  and municipal services, submit service requests and complaints, apply
  for certificates and permits, track applications, and receive
  government service notifications.

criticality: high

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: morning
      start: "06:00"
      end: "10:00"
      priority: 6

    - id: daytime
      start: "10:00"
      end: "18:00"
      priority: 8

    - id: evening
      start: "18:00"
      end: "22:00"
      priority: 7

    - id: night
      start: "22:00"
      end: "06:00"
      priority: 5

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: moderate
    networkActivity: high
    expectedOperations: citizen_service_access
    expectedUsers: high
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: high
    networkActivity: very_high
    expectedOperations: citizen_service_access
    expectedUsers: very_high
    healthStatus: healthy

  night:
    activityLevel: low
    communicationPattern: continuous
    workload: light
    administrativeActivity: low
    networkActivity: moderate
    expectedOperations: citizen_service_access
    expectedUsers: low
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: high
    administrativeActivity: moderate
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: very_high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: active_users
      unit: users
      min: 0
      max: 500000

    - name: login_requests
      unit: requests/min
      min: 0
      max: 50000

    - name: service_requests
      unit: requests/min
      min: 0
      max: 20000

    - name: application_submissions
      unit: submissions/min
      min: 0
      max: 10000

    - name: certificate_requests
      unit: requests/min
      min: 0
      max: 5000

    - name: complaint_submissions
      unit: submissions/min
      min: 0
      max: 5000

    - name: payment_requests
      unit: requests/min
      min: 0
      max: 5000

    - name: response_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: failed_requests
      unit: requests/min
      min: 0
      max: 10000

    - name: authentication_failures
      unit: failures/min
      min: 0
      max: 10000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 1000000000

actors:

  - citizens
  - government-employees
  - municipal-administrators
  - service-operators

dependencies: []

metadata:

  environment: production

  protocols:
    - HTTPS
    - TLS
    - REST

  capabilities:
    - citizen_service_access
    - application_submission
    - complaint_management
    - certificate_services
    - service_tracking
    - online_payments

  security:
    authentication: true
    encrypted_communication: true
    access_control: true
    audit_logging: true

  location:
    facility: government_data_center
    zone: government_network
id: government-network-gateway
name: Government Network Gateway

category: government
type: government_network_gateway

description: >
  Secure network gateway responsible for providing controlled connectivity
  between government offices, municipal systems, citizen-facing services,
  internal government networks, and external digital services.

criticality: critical

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: daytime
      start: "06:00"
      end: "22:00"
      priority: 8

    - id: night
      start: "22:00"
      end: "06:00"
      priority: 5

behaviour:

  normal:
    activityLevel: high
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: moderate
    networkActivity: very_high
    expectedOperations: government_network_connectivity
    expectedUsers: high
    healthStatus: healthy

  peak:
    activityLevel: very_high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: high
    networkActivity: very_high
    expectedOperations: government_network_connectivity
    expectedUsers: very_high
    healthStatus: healthy

  night:
    activityLevel: moderate
    communicationPattern: continuous
    workload: light
    administrativeActivity: low
    networkActivity: high
    expectedOperations: government_network_connectivity
    expectedUsers: moderate
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: very_high
    administrativeActivity: moderate
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: active_connections
      unit: connections
      min: 0
      max: 100000

    - name: incoming_bandwidth
      unit: bytes/s
      min: 0
      max: 5000000000

    - name: outgoing_bandwidth
      unit: bytes/s
      min: 0
      max: 5000000000

    - name: packets_per_second
      unit: packets/s
      min: 0
      max: 5000000

    - name: authentication_requests
      unit: requests/min
      min: 0
      max: 50000

    - name: blocked_connections
      unit: connections/min
      min: 0
      max: 50000

    - name: network_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: packet_loss
      unit: percent
      min: 0
      max: 100

    - name: connection_failures
      unit: failures/min
      min: 0
      max: 10000

    - name: routing_errors
      unit: errors/min
      min: 0
      max: 10000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

actors:

  - government-employees
  - government-administrators
  - network-administrators
  - municipal-operators

dependencies: []

metadata:

  environment: production

  protocols:
    - TCP
    - UDP
    - HTTPS
    - TLS
    - BGP

  capabilities:
    - network_routing
    - traffic_control
    - access_control
    - network_monitoring

  security:
    firewalling: true
    access_control: true
    encrypted_communication: true

  location:
    facility: government_data_center
    zone: government_network
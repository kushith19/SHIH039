id: scada-backup-power
name: SCADA Backup Power

category: energy
type: scada_backup_power

description: >
  Standby power path for the energy SCADA control server if the
  primary substation feed is lost.

criticality: critical

operating_schedule:
  defaultPhase: 24x7
  phases:
    - id: daytime
      start: "06:00"
      end: "22:00"
      priority: 8
    - id: night
      start: "22:00"
      end: "06:00"
      priority: 8

behaviour:
  normal:
    activityLevel: low
    communicationPattern: periodic
    workload: light
    networkActivity: low
    healthStatus: healthy
  peak:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    networkActivity: moderate
    healthStatus: healthy
  night:
    activityLevel: low
    communicationPattern: periodic
    workload: light
    networkActivity: low
    healthStatus: healthy

states:
  healthy:
    workload: light
    networkActivity: low
    healthStatus: healthy
  degraded:
    workload: moderate
    networkActivity: high
    healthStatus: degraded

telemetry:
  metrics:
    - name: packets_forwarded
      unit: packets/s
      min: 0
      max: 12000
    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

actors: []
dependencies:
  - endpoint: scada-control-server
    type: backup
    weight: 0.9

metadata:
  role: backup

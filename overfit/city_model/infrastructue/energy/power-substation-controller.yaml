id: power-substation-controller
name: Power Substation Controller

category: energy
type: substation_controller

description: >
  Operational technology controller responsible for monitoring and
  controlling electrical substation equipment, including transformer
  status, circuit breakers, voltage, current, frequency, and power load.
  The controller communicates operational measurements to the city's
  energy control infrastructure.

criticality: critical

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: daytime
      start: "06:00"
      end: "22:00"
      priority: 8

    - id: night
      start: "22:00"
      end: "06:00"
      priority: 5

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: low
    networkActivity: high
    expectedOperations: substation_monitoring
    expectedUsers: low
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: moderate
    networkActivity: very_high
    expectedOperations: load_management
    expectedUsers: moderate
    healthStatus: healthy

  night:
    activityLevel: low
    communicationPattern: continuous
    workload: light
    administrativeActivity: low
    networkActivity: moderate
    expectedOperations: substation_monitoring
    expectedUsers: low
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: high
    administrativeActivity: low
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: moderate
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: voltage
      unit: kV
      min: 0
      max: 500

    - name: current
      unit: amperes
      min: 0
      max: 5000

    - name: frequency
      unit: Hz
      min: 45
      max: 55

    - name: active_power
      unit: MW
      min: 0
      max: 1000

    - name: reactive_power
      unit: MVAr
      min: 0
      max: 500

    - name: power_factor
      unit: ratio
      min: 0
      max: 1

    - name: transformer_load
      unit: percent
      min: 0
      max: 120

    - name: breaker_operations
      unit: operations/min
      min: 0
      max: 500

    - name: electrical_faults
      unit: events/min
      min: 0
      max: 100

    - name: controller_response_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 200000000

actors:

  - power-operators
  - grid-engineers
  - maintenance-technicians
  - energy-administrators

dependencies:

  - endpoint: telecom-network-gateway
    type: required
    weight: 0.9

metadata:

  environment: operational

  protocols:
    - IEC_61850
    - Modbus
    - DNP3
    - TLS

  functions:
    - substation_monitoring
    - equipment_monitoring
    - load_monitoring
    - breaker_control
    - fault_detection

  equipment:
    - transformer
    - circuit_breaker
    - protection_relay

  location:
    facility: electrical_substation
    zone: energy_infrastructure
id: water-treatment-control
name: Water Treatment Control System

category: water
type: water_treatment_control

description: >
  Central industrial control system responsible for monitoring and
  coordinating water treatment processes, including pumping, filtration,
  chemical dosing, storage levels, and treatment plant operating status.

criticality: critical

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: daytime
      start: "06:00"
      end: "22:00"
      priority: 8

    - id: night
      start: "22:00"
      end: "06:00"
      priority: 5

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: low
    networkActivity: high
    expectedOperations: water_treatment
    expectedUsers: low
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: moderate
    networkActivity: very_high
    expectedOperations: water_treatment
    expectedUsers: moderate
    healthStatus: healthy

  night:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: low
    networkActivity: high
    expectedOperations: water_treatment
    expectedUsers: low
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: high
    administrativeActivity: low
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: moderate
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: water_flow_rate
      unit: liters/s
      min: 0
      max: 10000

    - name: treatment_throughput
      unit: liters/s
      min: 0
      max: 10000

    - name: reservoir_level
      unit: percent
      min: 0
      max: 100

    - name: pipeline_pressure
      unit: bar
      min: 0
      max: 20

    - name: pump_status
      unit: state
      min: 0
      max: 1

    - name: chemical_dosing_rate
      unit: liters/h
      min: 0
      max: 1000

    - name: treatment_process_errors
      unit: errors/min
      min: 0
      max: 500

    - name: controller_response_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 200000000

    - name: active_connections
      unit: connections
      min: 0
      max: 5000

actors:

  - water-plant-operators
  - water-engineers
  - water-administrators
  - maintenance-technicians

dependencies:

  - endpoint: water-quality-monitoring
    type: supporting
    weight: 0.8

metadata:

  environment: production

  protocols:
    - HTTPS
    - MQTT
    - TLS

  functions:
    - water_treatment
    - pump_control
    - filtration_monitoring
    - chemical_dosing
    - reservoir_monitoring

  location:
    facility: water_treatment_plant
    zone: water_infrastructure
id: telecom-backup-gateway
name: Telecom Backup Gateway

category: telecommunications
type: telecom_backup_gateway

description: >
  Standby WAN gateway that takes over city telecommunications routing
  if the primary telecom-network-gateway fails.

criticality: high

operating_schedule:
  defaultPhase: 24x7
  phases:
    - id: daytime
      start: "06:00"
      end: "22:00"
      priority: 4
    - id: night
      start: "22:00"
      end: "06:00"
      priority: 3

behaviour:
  normal:
    activityLevel: low
    communicationPattern: periodic
    workload: light
    networkActivity: low
    healthStatus: healthy
  peak:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    networkActivity: moderate
    healthStatus: healthy
  night:
    activityLevel: low
    communicationPattern: periodic
    workload: light
    networkActivity: low
    healthStatus: healthy

states:
  healthy:
    workload: light
    networkActivity: low
    healthStatus: healthy
  degraded:
    workload: moderate
    networkActivity: high
    healthStatus: degraded

telemetry:
  metrics:
    - name: packets_forwarded
      unit: packets/s
      min: 0
      max: 50000
    - name: cpu_usage
      unit: percent
      min: 0
      max: 100
    - name: failed_authentication_attempts
      unit: attempts/min
      min: 0
      max: 200

actors: []
dependencies:
  - endpoint: telecom-network-gateway
    type: backup
    weight: 0.9

metadata:
  role: backup

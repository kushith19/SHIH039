id: education-management-system
name: Education Management System

category: education
type: education_management_system

description: >
  Central digital platform used by educational institutions to manage
  administrative and academic operations, including admissions, student
  administration, staff records, academic planning, institutional
  workflows, and reporting.

criticality: high

operating_schedule:
  defaultPhase: daytime

  phases:
    - id: morning
      start: "08:00"
      end: "13:00"
      priority: 8

    - id: afternoon
      start: "13:00"
      end: "17:00"
      priority: 8

    - id: evening
      start: "17:00"
      end: "21:00"
      priority: 5

    - id: night
      start: "21:00"
      end: "08:00"
      priority: 3

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: high
    networkActivity: moderate
    expectedOperations: academic_administration
    expectedUsers: moderate
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: very_high
    networkActivity: high
    expectedOperations: academic_administration
    expectedUsers: high
    healthStatus: healthy

  night:
    activityLevel: low
    communicationPattern: periodic
    workload: light
    administrativeActivity: low
    networkActivity: low
    expectedOperations: administrative_maintenance
    expectedUsers: low
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: moderate
    administrativeActivity: high
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: high
    administrativeActivity: very_high
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: low
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: moderate
    administrativeActivity: very_high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: high
    administrativeActivity: very_high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: active_users
      unit: users
      min: 0
      max: 10000

    - name: login_requests
      unit: requests/min
      min: 0
      max: 5000

    - name: student_record_requests
      unit: requests/min
      min: 0
      max: 5000

    - name: administrative_transactions
      unit: transactions/min
      min: 0
      max: 3000

    - name: admission_requests
      unit: requests/min
      min: 0
      max: 2000

    - name: report_generation_requests
      unit: requests/min
      min: 0
      max: 1000

    - name: response_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: failed_requests
      unit: requests/min
      min: 0
      max: 1000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: database_queries
      unit: queries/s
      min: 0
      max: 5000

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 300000000

actors:

  - students
  - teachers
  - administrative-staff
  - education-administrators

dependencies:

  - endpoint: campus-network-gateway
    type: required
    weight: 1.0

metadata:

  environment: production

  protocols:
    - HTTPS
    - TLS
    - REST

  functions:
    - admissions
    - student_administration
    - staff_management
    - academic_planning
    - institutional_reporting

  dataClassification:
    - student_records
    - staff_records
    - academic_records

  location:
    facility: educational_institution
    zone: education_network
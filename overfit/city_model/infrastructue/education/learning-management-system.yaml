id: learning-management-system
name: Learning Management System

category: education
type: learning_management_system

description: >
  Digital learning platform used by students and teachers to access
  course materials, conduct online classes, submit assignments,
  complete assessments, and manage course-related activities.

criticality: high

operating_schedule:
  defaultPhase: daytime

  phases:
    - id: morning
      start: "08:00"
      end: "13:00"
      priority: 8

    - id: afternoon
      start: "13:00"
      end: "17:00"
      priority: 8

    - id: evening
      start: "17:00"
      end: "22:00"
      priority: 10

    - id: night
      start: "22:00"
      end: "08:00"
      priority: 4

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: moderate
    networkActivity: high
    expectedOperations: online_learning
    expectedUsers: moderate
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: high
    networkActivity: very_high
    expectedOperations: online_learning
    expectedUsers: very_high
    healthStatus: healthy

  night:
    activityLevel: moderate
    communicationPattern: periodic
    workload: light
    administrativeActivity: low
    networkActivity: moderate
    expectedOperations: content_access
    expectedUsers: moderate
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: high
    administrativeActivity: moderate
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: active_users
      unit: users
      min: 0
      max: 20000

    - name: login_requests
      unit: requests/min
      min: 0
      max: 10000

    - name: course_access_requests
      unit: requests/min
      min: 0
      max: 10000

    - name: assignment_submissions
      unit: submissions/min
      min: 0
      max: 5000

    - name: online_class_sessions
      unit: sessions
      min: 0
      max: 2000

    - name: assessment_requests
      unit: requests/min
      min: 0
      max: 5000

    - name: content_downloads
      unit: downloads/min
      min: 0
      max: 10000

    - name: response_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: failed_requests
      unit: requests/min
      min: 0
      max: 2000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 1000000000

actors:

  - students
  - teachers
  - education-administrators

dependencies:

  - endpoint: campus-network-gateway
    type: required
    weight: 1.0

metadata:

  environment: production

  protocols:
    - HTTPS
    - TLS
    - REST

  functions:
    - course_management
    - content_delivery
    - assignment_management
    - online_assessment
    - online_learning

  dataClassification:
    - student_activity
    - course_data
    - assessment_data

  location:
    facility: educational_institution
    zone: education_network
id: campus-network-gateway
name: Campus Network Gateway

category: education
type: campus_network_gateway

description: >
  Network gateway responsible for providing secure connectivity between
  educational institution networks, student and staff devices, learning
  platforms, administrative systems, and external digital services.

criticality: high

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: morning
      start: "07:00"
      end: "13:00"
      priority: 8

    - id: afternoon
      start: "13:00"
      end: "17:00"
      priority: 8

    - id: evening
      start: "17:00"
      end: "22:00"
      priority: 6

    - id: night
      start: "22:00"
      end: "07:00"
      priority: 5

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: low
    networkActivity: high
    expectedOperations: network_connectivity
    expectedUsers: high
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: moderate
    networkActivity: very_high
    expectedOperations: network_connectivity
    expectedUsers: very_high
    healthStatus: healthy

  night:
    activityLevel: low
    communicationPattern: continuous
    workload: light
    administrativeActivity: low
    networkActivity: moderate
    expectedOperations: network_connectivity
    expectedUsers: low
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: high
    administrativeActivity: low
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: moderate
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: connected_devices
      unit: devices
      min: 0
      max: 50000

    - name: active_connections
      unit: connections
      min: 0
      max: 50000

    - name: incoming_bandwidth
      unit: bytes/s
      min: 0
      max: 2000000000

    - name: outgoing_bandwidth
      unit: bytes/s
      min: 0
      max: 2000000000

    - name: requests_per_second
      unit: requests/s
      min: 0
      max: 50000

    - name: authentication_requests
      unit: requests/min
      min: 0
      max: 20000

    - name: blocked_connections
      unit: connections/min
      min: 0
      max: 10000

    - name: network_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: packet_loss
      unit: percent
      min: 0
      max: 100

    - name: connection_errors
      unit: errors/min
      min: 0
      max: 5000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

actors:

  - students
  - teachers
  - administrative-staff
  - education-administrators
  - it-administrators

dependencies:

  - endpoint: telecom-network-gateway
    type: required
    weight: 1.0

metadata:

  environment: production

  protocols:
    - HTTPS
    - TLS
    - DHCP
    - DNS

  capabilities:
    - network_routing
    - access_control
    - traffic_monitoring
    - network_security

  location:
    facility: educational_institution
    zone: campus_network
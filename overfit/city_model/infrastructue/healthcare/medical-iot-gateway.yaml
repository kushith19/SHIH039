id: medical-iot-gateway
name: Hospital Medical IoT Gateway

category: healthcare
type: medical_iot_gateway

description: >
  Edge gateway responsible for collecting, processing, and securely
  forwarding telemetry from connected medical devices and patient
  monitoring systems to hospital clinical applications.

criticality: high

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: daytime
      start: "06:00"
      end: "23:00"
      priority: 8

    - id: night
      start: "23:00"
      end: "06:00"
      priority: 5

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: low
    networkActivity: high
    expectedOperations: device_telemetry_collection
    expectedUsers: low
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: moderate
    networkActivity: very_high
    expectedOperations: device_telemetry_collection
    expectedUsers: moderate
    healthStatus: healthy

  night:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: low
    networkActivity: high
    expectedOperations: device_telemetry_collection
    expectedUsers: low
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: high
    administrativeActivity: low
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: moderate
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: low
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: connected_devices
      unit: devices
      min: 0
      max: 5000

    - name: telemetry_messages
      unit: messages/s
      min: 0
      max: 20000

    - name: device_message_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: dropped_messages
      unit: messages/s
      min: 0
      max: 5000

    - name: device_connection_failures
      unit: failures/s
      min: 0
      max: 1000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 500000000

    - name: active_connections
      unit: connections
      min: 0
      max: 10000

    - name: anomalous_device_traffic
      unit: events/s
      min: 0
      max: 1000

actors:

  - medical-devices
  - doctors
  - nurses
  - clinical-applications
  - hospital-it-administrators

dependencies:

  - endpoint: hospital-api-gateway
    type: required
    weight: 0.9

  - endpoint: hospital-auth
    type: required
    weight: 0.8

  - endpoint: telecom-network-gateway
    type: required
    weight: 1.0

metadata:

  environment: production

  protocols:
    - HTTPS
    - MQTT
    - TLS

  deviceTypes:
    - patient_monitors
    - vital_sign_sensors
    - infusion_pumps
    - diagnostic_devices

  security:
    deviceAuthentication: true
    encryptedCommunication: true

  location:
    facility: hospital
    zone: medical_device_network
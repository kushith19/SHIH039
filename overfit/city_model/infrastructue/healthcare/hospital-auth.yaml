id: hospital-auth
name: Hospital Authentication Server

category: healthcare
type: authentication_server

description: >
  Central identity and access management service used by hospital staff,
  administrators, clinical applications, and internal healthcare systems.
  The service authenticates users, manages sessions, and provides
  authorization services for protected hospital applications.

criticality: critical

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: morning_shift
      start: "06:00"
      end: "10:00"
      priority: 10

    - id: daytime
      start: "10:00"
      end: "18:00"
      priority: 5

    - id: evening_shift
      start: "18:00"
      end: "23:00"
      priority: 8

    - id: night
      start: "23:00"
      end: "06:00"
      priority: 5

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: moderate
    networkActivity: moderate
    expectedOperations: authentication
    expectedUsers: moderate
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: high
    networkActivity: high
    expectedOperations: authentication
    expectedUsers: high
    healthStatus: healthy

  night:
    activityLevel: low
    communicationPattern: continuous
    workload: light
    administrativeActivity: low
    networkActivity: low
    expectedOperations: authentication
    expectedUsers: low
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: moderate
    administrativeActivity: moderate
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: high
    administrativeActivity: high
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: low
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: moderate
    administrativeActivity: high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: authentication_requests
      unit: requests/s
      min: 0
      max: 1000

    - name: failed_authentication_attempts
      unit: attempts/s
      min: 0
      max: 500

    - name: successful_authentication_attempts
      unit: attempts/s
      min: 0
      max: 1000

    - name: active_sessions
      unit: sessions
      min: 0
      max: 5000

    - name: authorization_requests
      unit: requests/s
      min: 0
      max: 1000

    - name: authentication_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 100000000

    - name: active_connections
      unit: connections
      min: 0
      max: 10000

dependencies:

  - endpoint: hospital-api-gateway
    type: required
    weight: 1.0

  - endpoint: hospital-database
    type: required
    weight: 0.9

  - endpoint: telecom-network-gateway
    type: required
    weight: 1.0

actors:

  - doctors
  - nurses
  - hospital-administrators
  - hospital-it-administrators
  - clinical-applications

metadata:

  environment: production

  protocols:
    - HTTPS
    - TLS
    - LDAP

  authenticationMethods:
    - password
    - multi_factor_authentication
    - service_credentials

  dataClassification:
    - identity_data
    - access_control_data

  location:
    facility: hospital
    zone: internal_network
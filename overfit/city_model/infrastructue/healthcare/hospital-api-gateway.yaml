id: hospital-api-gateway
name: Hospital API Gateway

category: healthcare
type: api_gateway

description: >
  Central API gateway that manages and routes communication between
  hospital applications, clinical systems, authentication services,
  pharmacy services, medical IoT services, and external healthcare
  integrations.

criticality: high

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: daytime
      start: "06:00"
      end: "23:00"
      priority: 8

    - id: night
      start: "23:00"
      end: "06:00"
      priority: 5

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: low
    networkActivity: high
    expectedOperations: api_routing
    expectedUsers: high
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: moderate
    networkActivity: very_high
    expectedOperations: api_routing
    expectedUsers: very_high
    healthStatus: healthy

  night:
    activityLevel: low
    communicationPattern: continuous
    workload: light
    administrativeActivity: low
    networkActivity: moderate
    expectedOperations: api_routing
    expectedUsers: low
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: high
    administrativeActivity: low
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: moderate
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: requests_per_second
      unit: requests/s
      min: 0
      max: 10000

    - name: response_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: successful_requests
      unit: requests/s
      min: 0
      max: 10000

    - name: failed_requests
      unit: requests/s
      min: 0
      max: 5000

    - name: active_connections
      unit: connections
      min: 0
      max: 10000

    - name: incoming_network_bytes
      unit: bytes/s
      min: 0
      max: 500000000

    - name: outgoing_network_bytes
      unit: bytes/s
      min: 0
      max: 500000000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: rate_limited_requests
      unit: requests/s
      min: 0
      max: 5000

actors:

  - doctors
  - nurses
  - hospital-administrators
  - clinical-applications
  - pharmacy-system
  - medical-iot-gateway

dependencies:

  - endpoint: hospital-auth
    type: required
    weight: 0.9

  - endpoint: hospital-database
    type: supporting
    weight: 0.7

  - endpoint: telecom-network-gateway
    type: required
    weight: 1.0

metadata:

  environment: production

  protocols:
    - HTTPS
    - TLS
    - REST
    - JSON

  security:
    rateLimiting: true
    authenticationRequired: true
    tlsEnabled: true

  location:
    facility: hospital
    zone: application_network
id: hospital-database
name: Hospital Clinical Database

category: healthcare
type: database_server

description: >
  Central database infrastructure storing patient records, clinical
  information, treatment history, medication records, and other
  operational data required by hospital applications.

criticality: critical

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: daytime
      start: "06:00"
      end: "23:00"
      priority: 8

    - id: night
      start: "23:00"
      end: "06:00"
      priority: 5

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: moderate
    networkActivity: moderate
    expectedOperations: database_queries
    expectedUsers: high
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: high
    networkActivity: high
    expectedOperations: database_queries
    expectedUsers: high
    healthStatus: healthy

  night:
    activityLevel: low
    communicationPattern: continuous
    workload: light
    administrativeActivity: moderate
    networkActivity: low
    expectedOperations: database_queries
    expectedUsers: low
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: moderate
    administrativeActivity: moderate
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: high
    administrativeActivity: high
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: low
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: moderate
    administrativeActivity: high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: queries_per_second
      unit: queries/s
      min: 0
      max: 5000

    - name: active_connections
      unit: connections
      min: 0
      max: 1000

    - name: transaction_rate
      unit: transactions/s
      min: 0
      max: 2000

    - name: query_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: failed_queries
      unit: errors/s
      min: 0
      max: 500

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: storage_usage
      unit: percent
      min: 0
      max: 100

    - name: disk_io
      unit: operations/s
      min: 0
      max: 10000

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 200000000

actors:

  - clinical-applications
  - hospital-it-administrators
  - hospital-database-administrators

dependencies:

  - endpoint: telecom-network-gateway
    type: required
    weight: 1.0

metadata:

  environment: production

  protocols:
    - TCP
    - TLS

  dataClassification:
    - protected_health_information
    - clinical_data
    - patient_records

  storage:
    type: relational_database
    backupEnabled: true

  location:
    facility: hospital
    zone: clinical_network
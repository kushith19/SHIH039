id: traffic-sensor-gateway
name: Traffic Sensor Gateway

category: transportation
type: traffic_sensor_gateway

description: >
  Edge gateway responsible for collecting and aggregating telemetry
  from roadside traffic sensors, including vehicle counters, speed
  sensors, lane occupancy sensors, and traffic flow detectors. The
  gateway processes sensor data and forwards it to the central traffic
  management infrastructure.

criticality: high

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: morning_rush
      start: "07:00"
      end: "10:00"
      priority: 10

    - id: daytime
      start: "10:00"
      end: "17:00"
      priority: 5

    - id: evening_rush
      start: "17:00"
      end: "21:00"
      priority: 10

    - id: night
      start: "21:00"
      end: "07:00"
      priority: 5

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: low
    networkActivity: high
    expectedOperations: sensor_data_collection
    expectedUsers: low
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: low
    networkActivity: very_high
    expectedOperations: sensor_data_collection
    expectedUsers: low
    healthStatus: healthy

  night:
    activityLevel: low
    communicationPattern: continuous
    workload: light
    administrativeActivity: low
    networkActivity: moderate
    expectedOperations: sensor_data_collection
    expectedUsers: low
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: high
    administrativeActivity: low
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: moderate
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: low
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: connected_sensors
      unit: sensors
      min: 0
      max: 5000

    - name: sensor_messages
      unit: messages/s
      min: 0
      max: 20000

    - name: vehicle_count
      unit: vehicles/min
      min: 0
      max: 10000

    - name: average_vehicle_speed
      unit: km/h
      min: 0
      max: 150

    - name: lane_occupancy
      unit: percent
      min: 0
      max: 100

    - name: sensor_message_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: dropped_sensor_messages
      unit: messages/s
      min: 0
      max: 5000

    - name: sensor_connection_failures
      unit: failures/s
      min: 0
      max: 1000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 200000000

actors:

  - traffic-operators
  - traffic-control-administrators
  - roadside-sensors

dependencies:

 

  - endpoint: telecom-network-gateway
    type: required
    weight: 1.0

metadata:

  environment: production

  protocols:
    - MQTT
    - HTTPS
    - TLS

  sensorTypes:
    - vehicle_counter
    - speed_sensor
    - lane_occupancy_sensor
    - traffic_flow_detector

  capabilities:
    - sensor_aggregation
    - traffic_measurement
    - edge_processing

  location:
    facility: roadside
    zone: transportation_network
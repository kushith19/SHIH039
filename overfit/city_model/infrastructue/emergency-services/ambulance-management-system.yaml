id: ambulance-management-system
name: Ambulance Management System

category: emergency-services
type: ambulance_management_system

description: >
  Digital platform responsible for monitoring ambulance availability,
  tracking ambulance locations and status, coordinating ambulance
  dispatch, and managing emergency patient transport operations.

criticality: critical

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: daytime
      start: "06:00"
      end: "22:00"
      priority: 8

    - id: night
      start: "22:00"
      end: "06:00"
      priority: 5

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: moderate
    networkActivity: high
    expectedOperations: ambulance_coordination
    expectedUsers: moderate
    healthStatus: healthy

  peak:
    activityLevel: very_high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: high
    networkActivity: very_high
    expectedOperations: emergency_transport
    expectedUsers: high
    healthStatus: healthy

  night:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: low
    networkActivity: high
    expectedOperations: ambulance_coordination
    expectedUsers: low
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: high
    administrativeActivity: moderate
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: very_high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: available_ambulances
      unit: vehicles
      min: 0
      max: 5000

    - name: active_ambulances
      unit: vehicles
      min: 0
      max: 5000

    - name: ambulance_location_updates
      unit: updates/min
      min: 0
      max: 10000

    - name: dispatch_requests
      unit: requests/min
      min: 0
      max: 5000

    - name: active_emergency_transports
      unit: transports
      min: 0
      max: 5000

    - name: average_response_time
      unit: seconds
      min: 0
      max: 3600

    - name: hospital_destination_updates
      unit: updates/min
      min: 0
      max: 5000

    - name: vehicle_communication_failures
      unit: failures/min
      min: 0
      max: 1000

    - name: location_update_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 300000000

actors:

  - paramedics
  - ambulance-drivers
  - emergency-dispatchers
  - emergency-administrators
  - hospital-coordinators

dependencies: []

metadata:

  environment: production

  protocols:
    - HTTPS
    - TLS
    - MQTT
    - GPS

  capabilities:
    - ambulance_tracking
    - ambulance_dispatch
    - emergency_transport
    - vehicle_status_monitoring
    - hospital_destination_management

  security:
    authentication: true
    encrypted_communication: true
    access_control: true
    audit_logging: true

  location:
    facility: emergency_operations_center
    zone: emergency_services_network
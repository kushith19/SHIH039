id: public-safety-incident-system
name: Public Safety Incident System

category: public-safety
type: public_safety_incident_system

description: >
  Central platform for receiving, classifying, prioritizing, tracking,
  and coordinating public-safety incidents across the city. It maintains
  incident status and provides operational visibility to authorized
  public-safety personnel.

criticality: critical

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: daytime
      start: "06:00"
      end: "22:00"
      priority: 8

    - id: night
      start: "22:00"
      end: "06:00"
      priority: 6

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: moderate
    networkActivity: high
    expectedOperations: incident_management
    expectedUsers: moderate
    healthStatus: healthy

  peak:
    activityLevel: very_high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: high
    networkActivity: very_high
    expectedOperations: emergency_incident_management
    expectedUsers: high
    healthStatus: healthy

  night:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: low
    networkActivity: high
    expectedOperations: incident_monitoring
    expectedUsers: moderate
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: high
    administrativeActivity: moderate
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: very_high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: active_incidents
      unit: incidents
      min: 0
      max: 20000

    - name: incoming_incidents
      unit: incidents/min
      min: 0
      max: 10000

    - name: incident_updates
      unit: updates/min
      min: 0
      max: 10000

    - name: high_priority_incidents
      unit: incidents
      min: 0
      max: 5000

    - name: incident_classification_requests
      unit: requests/min
      min: 0
      max: 5000

    - name: response_coordination_requests
      unit: requests/min
      min: 0
      max: 5000

    - name: incident_processing_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: failed_requests
      unit: requests/min
      min: 0
      max: 2000

    - name: active_operator_sessions
      unit: sessions
      min: 0
      max: 5000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 500000000

actors:

  - police-officers
  - police-dispatchers
  - emergency-responders
  - public-safety-operators
  - public-safety-administrators

dependencies: []

metadata:

  environment: production

  protocols:
    - HTTPS
    - TLS
    - REST
    - MQTT

  capabilities:
    - incident_creation
    - incident_classification
    - incident_prioritization
    - incident_tracking
    - response_coordination

  security:
    authentication: true
    encrypted_communication: true
    access_control: true
    audit_logging: true

  location:
    facility: public_safety_operations_center
    zone: public_safety_network
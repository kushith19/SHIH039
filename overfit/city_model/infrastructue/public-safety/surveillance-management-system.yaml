id: surveillance-management-system
name: Surveillance Management System

category: public-safety
type: surveillance_management_system

description: >
  Central surveillance platform responsible for managing connected
  city surveillance cameras, monitoring camera health and availability,
  managing video streams and recordings, and providing authorized
  personnel with access to surveillance data.

criticality: critical

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: daytime
      start: "06:00"
      end: "22:00"
      priority: 8

    - id: night
      start: "22:00"
      end: "06:00"
      priority: 6

behaviour:

  normal:
    activityLevel: high
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: moderate
    networkActivity: very_high
    expectedOperations: surveillance_monitoring
    expectedUsers: moderate
    healthStatus: healthy

  peak:
    activityLevel: very_high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: high
    networkActivity: very_high
    expectedOperations: surveillance_monitoring
    expectedUsers: high
    healthStatus: healthy

  night:
    activityLevel: high
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: low
    networkActivity: very_high
    expectedOperations: surveillance_monitoring
    expectedUsers: moderate
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: very_high
    administrativeActivity: moderate
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: very_high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: connected_cameras
      unit: cameras
      min: 0
      max: 100000

    - name: active_camera_streams
      unit: streams
      min: 0
      max: 100000

    - name: camera_health_events
      unit: events/min
      min: 0
      max: 20000

    - name: video_stream_requests
      unit: requests/min
      min: 0
      max: 50000

    - name: recording_sessions
      unit: sessions
      min: 0
      max: 100000

    - name: video_storage_rate
      unit: bytes/s
      min: 0
      max: 5000000000

    - name: camera_connection_failures
      unit: failures/min
      min: 0
      max: 10000

    - name: video_stream_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: dropped_video_streams
      unit: streams/min
      min: 0
      max: 5000

    - name: active_operator_sessions
      unit: sessions
      min: 0
      max: 5000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 5000000000

actors:

  - police-officers
  - surveillance-operators
  - public-safety-operators
  - security-administrators

dependencies: []

metadata:

  environment: production

  protocols:
    - HTTPS
    - TLS
    - RTSP
    - RTP

  capabilities:
    - camera_management
    - video_streaming
    - video_recording
    - camera_health_monitoring
    - authorized_video_access

  security:
    authentication: true
    encrypted_communication: true
    access_control: true
    audit_logging: true

  location:
    facility: public_safety_operations_center
    zone: surveillance_network
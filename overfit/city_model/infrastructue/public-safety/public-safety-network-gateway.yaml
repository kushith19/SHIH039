id: public-safety-network-gateway
name: Public Safety Network Gateway

category: public-safety
type: public_safety_network_gateway

description: >
  Secure network gateway providing controlled connectivity between
  public safety operations centers, police systems, surveillance
  infrastructure, field units, and authorized external services.

criticality: critical

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: daytime
      start: "06:00"
      end: "22:00"
      priority: 8

    - id: night
      start: "22:00"
      end: "06:00"
      priority: 6

behaviour:

  normal:
    activityLevel: high
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: moderate
    networkActivity: very_high
    expectedOperations: public_safety_connectivity
    expectedUsers: high
    healthStatus: healthy

  peak:
    activityLevel: very_high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: high
    networkActivity: very_high
    expectedOperations: public_safety_connectivity
    expectedUsers: very_high
    healthStatus: healthy

  night:
    activityLevel: high
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: low
    networkActivity: very_high
    expectedOperations: public_safety_connectivity
    expectedUsers: moderate
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: very_high
    administrativeActivity: moderate
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: active_connections
      unit: connections
      min: 0
      max: 100000

    - name: connected_field_units
      unit: units
      min: 0
      max: 20000

    - name: incoming_bandwidth
      unit: bytes/s
      min: 0
      max: 5000000000

    - name: outgoing_bandwidth
      unit: bytes/s
      min: 0
      max: 5000000000

    - name: packets_per_second
      unit: packets/s
      min: 0
      max: 5000000

    - name: blocked_connections
      unit: connections/min
      min: 0
      max: 50000

    - name: authentication_requests
      unit: requests/min
      min: 0
      max: 50000

    - name: network_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: packet_loss
      unit: percent
      min: 0
      max: 100

    - name: connection_failures
      unit: failures/min
      min: 0
      max: 10000

    - name: routing_errors
      unit: errors/min
      min: 0
      max: 10000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

actors:

  - police-officers
  - emergency-responders
  - surveillance-operators
  - network-administrators
  - public-safety-administrators

dependencies: []

metadata:

  environment: production

  protocols:
    - TCP
    - UDP
    - HTTPS
    - TLS
    - VPN

  capabilities:
    - network_routing
    - secure_connectivity
    - traffic_control
    - access_control
    - field_unit_connectivity

  security:
    firewalling: true
    encrypted_communication: true
    authentication: true
    access_control: true

  location:
    facility: public_safety_operations_center
    zone: public_safety_network
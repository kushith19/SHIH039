id: police-management-system
name: Police Management System

category: public-safety
type: police_management_system

description: >
  Central digital platform used to manage police operations, patrol
  resources, officer assignments, incident records, case information,
  and operational coordination across the city's police services.

criticality: critical

operating_schedule:
  defaultPhase: 24x7

  phases:
    - id: daytime
      start: "06:00"
      end: "22:00"
      priority: 8

    - id: night
      start: "22:00"
      end: "06:00"
      priority: 6

behaviour:

  normal:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: high
    networkActivity: high
    expectedOperations: police_operations
    expectedUsers: moderate
    healthStatus: healthy

  peak:
    activityLevel: high
    communicationPattern: continuous
    workload: heavy
    administrativeActivity: very_high
    networkActivity: very_high
    expectedOperations: incident_and_patrol_management
    expectedUsers: high
    healthStatus: healthy

  night:
    activityLevel: moderate
    communicationPattern: continuous
    workload: moderate
    administrativeActivity: moderate
    networkActivity: high
    expectedOperations: patrol_management
    expectedUsers: moderate
    healthStatus: healthy

states:

  healthy:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: healthy

  busy:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: healthy

  degraded:
    workload: moderate
    networkActivity: high
    administrativeActivity: high
    healthStatus: degraded

  recovering:
    workload: moderate
    networkActivity: high
    administrativeActivity: very_high
    healthStatus: recovering

  suspicious:
    workload: elevated
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: suspicious

  under_attack:
    workload: heavy
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: critical

  compromised:
    workload: abnormal
    networkActivity: very_high
    administrativeActivity: very_high
    healthStatus: compromised

telemetry:

  metrics:

    - name: active_officers
      unit: officers
      min: 0
      max: 50000

    - name: active_incidents
      unit: incidents
      min: 0
      max: 10000

    - name: incident_updates
      unit: updates/min
      min: 0
      max: 10000

    - name: patrol_units
      unit: units
      min: 0
      max: 10000

    - name: patrol_location_updates
      unit: updates/min
      min: 0
      max: 20000

    - name: case_record_requests
      unit: requests/min
      min: 0
      max: 10000

    - name: dispatch_requests
      unit: requests/min
      min: 0
      max: 5000

    - name: authentication_failures
      unit: failures/min
      min: 0
      max: 5000

    - name: response_latency
      unit: milliseconds
      min: 1
      max: 5000

    - name: active_operator_sessions
      unit: sessions
      min: 0
      max: 5000

    - name: cpu_usage
      unit: percent
      min: 0
      max: 100

    - name: memory_usage
      unit: percent
      min: 0
      max: 100

    - name: network_bytes
      unit: bytes/s
      min: 0
      max: 500000000

actors:

  - police-officers
  - police-dispatchers
  - police-administrators
  - patrol-operators
  - public-safety-administrators

dependencies: []

metadata:

  environment: production

  protocols:
    - HTTPS
    - TLS
    - REST
    - MQTT

  capabilities:
    - incident_management
    - patrol_management
    - officer_management
    - case_management
    - resource_coordination

  security:
    authentication: true
    encrypted_communication: true
    access_control: true
    audit_logging: true

  location:
    facility: police_operations_center
    zone: public_safety_network